<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa — Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#f4eddf;
    --card:#fffaf0;
    --paper:#fbf5e8;
    --ink:#342d25;
    --ink-soft:#6e6253;
    --muted:#998d7d;
    --line:#dfd1bb;
    --sage:#7f9364;
    --sage-deep:#566b43;
    --sage-tint:#edf1df;
    --terra:#be6c45;
    --terra-tint:#f4dfcf;
    --terra-deep:#9c4d2c;
    --gold:#c79a48;
    --berry:#9a665e;
    --shadow:0 10px 24px rgba(73,54,32,.10);
    --shadow-soft:0 3px 10px rgba(73,54,32,.07);
    --radius:14px;
    --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --font-script:"Snell Roundhand","Bradley Hand","Segoe Script",cursive;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-serif);
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.62) 0 1px, transparent 1.5px),
      radial-gradient(circle at 78% 42%, rgba(116,87,44,.08) 0 1px, transparent 1.6px),
      linear-gradient(90deg, rgba(109,79,42,.035) 1px, transparent 1px),
      var(--bg);
    background-size:22px 22px, 31px 31px, 34px 34px, auto;
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  h1{font-family:var(--font-script);font-size:36px;line-height:1.05;margin:0 0 2px;font-weight:500;color:#2f281f;}
  .sub{color:var(--muted);font-size:13.5px;margin:0;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;color:var(--sage-deep);margin:0 0 4px;}

  .card{background:rgba(255,250,240,.92);border-radius:var(--radius);box-shadow:var(--shadow-soft);padding:20px;margin-top:14px;border:1px solid rgba(176,146,105,.38);}
  .row{display:flex;align-items:center;gap:12px;}
  .between{justify-content:space-between;flex-wrap:wrap;}

  .cta{font:inherit;font-size:14.5px;font-weight:700;padding:12px 20px;border-radius:999px;border:0;cursor:pointer;background:var(--sage);color:#fff;box-shadow:var(--shadow-soft);transition:transform .12s ease;}
  .cta:active{transform:scale(.96);}
  .cta:disabled{opacity:.55;cursor:default;transform:none;}
  .cta.ghostbtn{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);box-shadow:none;}
  .cta.danger{background:var(--terra-deep);color:#fff;}
  .cta.small{padding:8px 14px;font-size:12.5px;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--sage-tint);color:var(--sage-deep);border:1px solid rgba(127,147,100,.16);}
  .pill.terra{background:var(--terra-tint);color:#b25e35;}
  .pill.ghost{background:#eef0ec;color:var(--ink-soft);}
  .pill.gold{background:#f6edd6;color:#9a7414;}
  .pill.danger{background:#fde8e8;color:#b91c1c;}

  .inp{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;background:rgba(255,250,240,.95);color:var(--ink);font-family:inherit;}
  .inp:focus{outline:2px solid var(--sage);outline-offset:1px;}

  .msg{font-size:13px;margin-top:10px;min-height:0;}
  .msg.error{color:var(--terra-deep);}
  .msg.ok{color:var(--sage-deep);}

  .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;background:linear-gradient(135deg,var(--sage),var(--sage-deep));flex:0 0 auto;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid rgba(223,209,187,.6);vertical-align:middle;}
  tr:last-child td{border-bottom:0;}
  .tbl-wrap{overflow-x:auto;margin-top:14px;-webkit-overflow-scrolling:touch;}
  .mono{font-variant-numeric:tabular-nums;color:var(--ink-soft);}
  .muted{color:var(--muted);}

  .confirm-row{background:var(--terra-tint);}
  .confirm-row td{padding:12px 10px;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .spinner-line{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center;}

  .gsi-btn{background:#fff;color:#3c4043;border:1.5px solid #dadce0;box-shadow:none;display:flex;align-items:center;justify-content:center;gap:10px;}

  footer.note{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.5;}
  a{color:var(--sage-deep);}

  .tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:14px;}
  .tab{font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;}
  .tab:hover{color:var(--ink-soft);}
  .tab.active{color:var(--sage-deep);border-bottom-color:var(--sage-deep);}
  .tab-pane{display:none;}
  .tab-pane.active{display:block;}

  .search-bar{margin-bottom:12px;}
  .search-bar input{width:100%;box-sizing:border-box;}
  .item-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(223,209,187,.4);gap:10px;cursor:pointer;}
  .item-row:hover{background:rgba(127,147,100,.06);}
  .item-row .item-title{font-weight:700;font-size:14px;}
  .item-row .item-sub{font-size:12px;color:var(--muted);}
  .item-list{max-height:65vh;overflow-y:auto;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
  .field .inp{font-size:14px;padding:10px 12px;}
  .field textarea.inp{min-height:120px;resize:vertical;font-family:monospace;font-size:12.5px;line-height:1.45;}

  .ing-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(223,209,187,.3);}
  .ing-row .ing-id{flex:1;font-size:13px;font-weight:600;}
  .ing-row .ing-g{width:70px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;}
  .ing-row .ing-del{background:none;border:0;color:var(--terra);cursor:pointer;font-size:16px;padding:2px 6px;}
  .add-ing-row{display:flex;gap:8px;margin-top:8px;}
  .add-ing-row input{font-size:13px;padding:6px 10px;}
  .back-link{font-size:13px;color:var(--sage-deep);cursor:pointer;margin-bottom:10px;display:inline-block;}
  .dirty-badge{display:inline-block;background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Mesa</p>
      <h1>Admin</h1>
      <p class="sub">Household seats &amp; access control — local tool, not part of the app.</p>
    </div>
    <div id="topRight"></div>
  </header>

  <div id="app"></div>

  <footer class="note">
    Served locally on <span class="mono">127.0.0.1:8322</span> — this origin is allow-listed by the
    Mesa sync worker for sign-in redirects. Only a Mesa account with admin rights can see anything
    beyond the sign-in screen.
  </footer>
</div>

<script>
(function(){
  'use strict';

  var SYNC_URL = 'https://mesa-sync.elenanesi55.workers.dev';
  var TOKEN_KEY = 'mesaAdminAuth'; // distinct from the app's 'mesaAuth' — different origin anyway, but keep it unambiguous

  var appEl = document.getElementById('app');
  var topRightEl = document.getElementById('topRight');

  /* ---------------- tiny local helpers (no dependency on app/js/*) ---------------- */

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getToken(){
    try{
      var t = localStorage.getItem(TOKEN_KEY);
      return (typeof t === 'string' && t) ? t : null;
    }catch(e){ return null; }
  }
  function setToken(t){
    try{
      if(t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    }catch(e){ /* storage unavailable — sign-in just won't persist across reloads */ }
  }

  function fmtDate(ms){
    if(typeof ms !== 'number' || !ms) return '—';
    try{ return new Date(ms).toLocaleString(); }catch(e){ return '—'; }
  }

  var GOOGLE_G_LOGO_SVG = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex:0 0 auto">'
    + '<path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>'
    + '<path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>'
    + '<path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>'
    + '<path fill="#EA4335" d="M9 3.579c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.579 9 3.579z"/>'
    + '</svg>';

  /* ---------------- hash-fragment pickup (same shape as app/js/auth.js) ---------------- */

  function consumeAuthHash(){
    var hash = location.hash || '';
    var authMatch = /^#auth=([^&]*)/.exec(hash);
    var errMatch = /^#auth_error=([^&]*)/.exec(hash);
    if(!authMatch && !errMatch) return null;

    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ /* ignore */ }

    if(authMatch){
      var token = decodeURIComponent(authMatch[1] || '');
      if(token) setToken(token);
      return 'token';
    }
    var reason = decodeURIComponent(errMatch[1] || '');
    return {error: reason};
  }

  function authErrorMessage(reason){
    if(reason === 'not_invited') return 'That Google account isn’t invited to Mesa — this admin tool needs an existing Mesa admin account.';
    if(reason === 'full') return 'Mesa is at capacity and can’t take new accounts.';
    return 'Sign-in didn’t work — please try again.';
  }

  function authSignIn(){
    var returnTo = encodeURIComponent(location.origin + location.pathname);
    location.href = SYNC_URL + '/auth/google/start?return_to=' + returnTo;
  }

  /* ---------------- fetch wrapper: every call sends the bearer token, a 401 signs out ---------------- */

  // Returns a promise resolving to {ok, status, body} — never rejects for HTTP-level
  // failures. On 401 it clears the token and re-renders signed-out BEFORE resolving, so
  // callers that check `sessionDied` can just stop (no need to duplicate the recovery).
  function api(path, opts){
    opts = opts || {};
    var token = getToken();
    var headers = Object.assign({}, opts.headers || {});
    if(token) headers.Authorization = 'Bearer ' + token;
    if(opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';

    if(typeof fetch !== 'function'){
      return Promise.resolve({ok: false, status: 0, body: {}, networkError: true});
    }

    return fetch(SYNC_URL + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body,
      cache: 'no-store'
    }).then(function(res){
      if(res.status === 401){
        setToken(null);
        renderSignedOut();
        return {ok: false, status: 401, body: {error: 'unauthorized'}, sessionDied: true};
      }
      return res.json().catch(function(){ return {}; }).then(function(body){
        return {ok: res.ok, status: res.status, body: (body && typeof body === 'object') ? body : {}};
      });
    }).catch(function(err){
      console.warn('Mesa admin: request failed', path, err);
      return {ok: false, status: 0, body: {}, networkError: true};
    });
  }

  /* ---------------- top-right sign-out control ---------------- */

  function renderTopRight(user){
    if(!user){ topRightEl.innerHTML = ''; return; }
    var name = escapeHtml(user.displayName || user.email || 'Signed in');
    var email = escapeHtml(user.email || '');
    topRightEl.innerHTML = '<div class="row" style="gap:10px">'
      + '<div style="text-align:right">'
      + '<div style="font-weight:700;font-size:13.5px">' + name + '</div>'
      + '<div class="muted" style="font-size:11.5px">' + email + '</div>'
      + '</div>'
      + '<button class="cta ghostbtn small" id="topSignOutBtn" type="button">Sign out</button>'
      + '</div>';
    var btn = document.getElementById('topSignOutBtn');
    if(btn) btn.addEventListener('click', signOut);
  }

  function signOut(){
    var token = getToken();
    setToken(null);
    renderSignedOut();
    if(token){
      api('/auth/logout', {method: 'POST'}).catch(function(){}); // best-effort; local clear already happened
    }
  }

  /* ---------------- signed-out state ---------------- */

  function renderSignedOut(message, isError){
    renderTopRight(null);
    var msgHtml = message
      ? '<p class="msg ' + (isError ? 'error' : '') + '">' + escapeHtml(message) + '</p>'
      : '';
    appEl.innerHTML = '<div class="card">'
      + '<p class="sub" style="margin:0 0 14px">Sign in with the Google account that runs this Mesa to manage seats and invites.</p>'
      + '<button class="cta gsi-btn" id="signInBtn" type="button">' + GOOGLE_G_LOGO_SVG + '<span>Sign in with Google</span></button>'
      + msgHtml
      + '</div>';
    var btn = document.getElementById('signInBtn');
    if(btn) btn.addEventListener('click', authSignIn);
  }

  function renderLoading(){
    renderTopRight(null);
    appEl.innerHTML = '<div class="card"><p class="spinner-line">Checking your session…</p></div>';
  }

  function renderNonAdmin(user){
    renderTopRight(user);
    appEl.innerHTML = '<div class="card">'
      + '<p class="sub" style="margin:0 0 10px">Signed in as <b>' + escapeHtml(user.email || '') + '</b>.</p>'
      + '<p style="margin:0 0 16px">This account isn’t a Mesa admin, so there’s nothing to show here.</p>'
      + '<button class="cta ghostbtn" id="nonAdminSignOutBtn" type="button">Sign out</button>'
      + '</div>';
    var btn = document.getElementById('nonAdminSignOutBtn');
    if(btn) btn.addEventListener('click', signOut);
  }

  /* ---------------- admin state ---------------- */

  var adminState = {
    selfEmail: null,
    seatsUsed: 0,
    seatsMax: 0,
    rows: [],
    confirmEmail: null // email currently in the two-step revoke-confirm row, or null
  };

  function renderAdminShell(user){
    renderTopRight(user);
    adminState.selfEmail = (user.email || '').toLowerCase();
    appEl.innerHTML = ''
      + '<div class="tabs" id="adminTabs">'
      + '  <button class="tab active" data-tab="people">People</button>'
      + '  <button class="tab" data-tab="recipes">Recipes</button>'
      + '  <button class="tab" data-tab="ingredients">Ingredients</button>'
      + '</div>'

      + '<div class="tab-pane active" id="pane-people">'
      + '<div class="card" id="seatsCard">'
      + '  <p class="sub" style="margin:0 0 6px">Seats</p>'
      + '  <p style="margin:0;font-size:20px;font-weight:700" id="seatsLine">…</p>'
      + '</div>'
      + '<div class="card">'
      + '  <p class="sub" style="margin:0 0 10px">Invite someone new</p>'
      + '  <div class="row" style="align-items:flex-start;gap:10px;flex-wrap:wrap">'
      + '    <input class="inp" id="inviteEmailInput" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="friend@email.com" style="flex:1;min-width:220px">'
      + '    <button class="cta" id="inviteBtn" type="button">Send invite</button>'
      + '  </div>'
      + '  <p class="msg" id="inviteMsg"></p>'
      + '</div>'
      + '<div class="card">'
      + '  <div class="row between">'
      + '    <p class="sub" style="margin:0">People</p>'
      + '    <button class="cta ghostbtn small" id="refreshBtn" type="button">Refresh</button>'
      + '  </div>'
      + '  <div id="tableHost"></div>'
      + '</div>'
      + '</div>'

      + '<div class="tab-pane" id="pane-recipes"><div class="card" id="recipesHost"><p class="spinner-line">Loading…</p></div></div>'
      + '<div class="tab-pane" id="pane-ingredients"><div class="card" id="ingredientsHost"><p class="spinner-line">Loading…</p></div></div>';

    var tabBar = document.getElementById('adminTabs');
    if(tabBar) tabBar.addEventListener('click', function(ev){
      var btn = ev.target.closest('.tab[data-tab]');
      if(!btn) return;
      var target = btn.getAttribute('data-tab');
      tabBar.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b === btn); });
      document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.toggle('active', p.id === 'pane-' + target); });
      if(target === 'recipes' && !catalogState.loaded) loadCatalog();
      if(target === 'ingredients' && !catalogState.loaded) loadCatalog();
    });

    var inviteBtn = document.getElementById('inviteBtn');
    var inviteInput = document.getElementById('inviteEmailInput');
    if(inviteBtn) inviteBtn.addEventListener('click', sendInvite);
    if(inviteInput) inviteInput.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){ ev.preventDefault(); sendInvite(); }
    });
    var refreshBtn = document.getElementById('refreshBtn');
    if(refreshBtn) refreshBtn.addEventListener('click', function(){ loadUsers(); });
  }

  function setSeatsLine(used, max){
    adminState.seatsUsed = used;
    adminState.seatsMax = max;
    var el = document.getElementById('seatsLine');
    if(el) el.textContent = used + ' of ' + max + ' seats used';
  }

  function setInviteBusy(busy){
    var btn = document.getElementById('inviteBtn');
    var input = document.getElementById('inviteEmailInput');
    if(btn){ btn.disabled = busy; btn.textContent = busy ? 'Sending…' : 'Send invite'; }
    if(input) input.disabled = busy;
  }

  function setInviteMsg(text, isError){
    var el = document.getElementById('inviteMsg');
    if(!el) return;
    el.textContent = text || '';
    el.className = 'msg' + (isError ? ' error' : (text ? ' ok' : ''));
  }

  function sendInvite(){
    var input = document.getElementById('inviteEmailInput');
    if(!input) return;
    var email = input.value.trim();
    if(!email){
      setInviteMsg('Enter an email address first.', true);
      return;
    }
    setInviteBusy(true);
    setInviteMsg('', false);

    api('/auth/invite-user', {method: 'POST', body: JSON.stringify({email: email})}).then(function(res){
      setInviteBusy(false);
      if(res.sessionDied) return;
      if(res.networkError){
        setInviteMsg('Couldn’t reach Mesa — check your connection and try again.', true);
        return;
      }
      if(res.ok && res.body && res.body.ok){
        setInviteMsg('Invited ' + res.body.email + '.', false);
        input.value = '';
        if(typeof res.body.seatsUsed === 'number' && typeof res.body.seatsMax === 'number'){
          setSeatsLine(res.body.seatsUsed, res.body.seatsMax);
        }
        loadUsers();
        return;
      }
      var code = res.body && res.body.error;
      if(code === 'invalid_email') setInviteMsg('That doesn’t look like a valid email address.', true);
      else if(code === 'not_admin') setInviteMsg('This account isn’t an admin.', true);
      else if(code === 'taken') setInviteMsg('That email is already a user or already invited.', true);
      else if(code === 'full') setInviteMsg('All seats are full — no room for new invites.', true);
      else if(code === 'rate_limited') setInviteMsg('Too many invites today — try again tomorrow.', true);
      else setInviteMsg('Couldn’t send the invite — please try again.', true);
    });
  }

  function statusPillHtml(row){
    if(row.signedUp && !row.allowed) return '<span class="pill danger">Revoked</span>';
    if(row.signedUp) return '<span class="pill">Signed up</span>';
    return '<span class="pill gold">Invited</span>';
  }

  function renderTable(){
    var host = document.getElementById('tableHost');
    if(!host) return;
    var rows = adminState.rows;

    if(!rows.length){
      host.innerHTML = '<div class="empty-state">No one invited yet.</div>';
      return;
    }

    var body = rows.map(function(row, idx){
      var email = escapeHtml(row.email);
      var isSelf = (row.email || '').toLowerCase() === adminState.selfEmail;
      var confirming = adminState.confirmEmail === row.email;

      if(confirming){
        return '<tr class="confirm-row" data-idx="' + idx + '">'
          + '<td colspan="8">'
          + '<div class="row between" style="flex-wrap:wrap;gap:10px">'
          + '<span>Revoke access for <b>' + email + '</b>? They’ll be signed out on every device. Their meal data is kept — re-inviting undoes this.</span>'
          + '<div class="row" style="gap:8px">'
          + '<button class="cta danger small" data-action="revoke-confirm" data-idx="' + idx + '" type="button">Yes, revoke</button>'
          + '<button class="cta ghostbtn small" data-action="revoke-cancel" data-idx="' + idx + '" type="button">Cancel</button>'
          + '</div></div></td></tr>';
      }

      var isRevoked = row.signedUp && !row.allowed;
      var actionBtn;
      if(isRevoked){
        actionBtn = '<button class="cta small" data-action="restore" data-idx="' + idx + '" type="button">Restore</button>';
      } else if(isSelf){
        actionBtn = '<button class="cta ghostbtn small" disabled title="You can’t revoke your own access here">Revoke</button>';
      } else {
        actionBtn = '<button class="cta ghostbtn small" data-action="revoke-start" data-idx="' + idx + '" type="button">Revoke</button>';
      }

      return '<tr data-idx="' + idx + '">'
        + '<td>' + email + (isSelf ? ' <span class="pill ghost">you</span>' : '') + '</td>'
        + '<td>' + statusPillHtml(row) + '</td>'
        + '<td class="mono">' + escapeHtml(row.memberSlot || '—') + '</td>'
        + '<td class="mono">' + escapeHtml(row.householdShort || '—') + '</td>'
        + '<td class="mono">' + (typeof row.sessions === 'number' ? row.sessions : 0) + '</td>'
        + '<td class="mono">' + fmtDate(row.lastSeenAt) + '</td>'
        + '<td>' + (row.isAdmin ? '<span class="pill terra">Admin</span>' : '') + '</td>'
        + '<td>' + actionBtn + '</td>'
        + '</tr>';
    }).join('');

    host.innerHTML = '<div class="tbl-wrap"><table>'
      + '<thead><tr>'
      + '<th>Email</th><th>Status</th><th>Slot</th><th>Household</th><th>Live sessions</th><th>Last seen</th><th>Admin</th><th></th>'
      + '</tr></thead>'
      + '<tbody id="tableBody">' + body + '</tbody>'
      + '</table></div>';

    var tbody = document.getElementById('tableBody');
    if(tbody) tbody.addEventListener('click', onTableClick);
  }

  function onTableClick(ev){
    var btn = ev.target.closest('button[data-action]');
    if(!btn) return;
    var idx = parseInt(btn.getAttribute('data-idx'), 10);
    var row = adminState.rows[idx];
    if(!row) return;
    var action = btn.getAttribute('data-action');

    if(action === 'revoke-start'){
      adminState.confirmEmail = row.email;
      renderTable();
      return;
    }
    if(action === 'revoke-cancel'){
      adminState.confirmEmail = null;
      renderTable();
      return;
    }
    if(action === 'revoke-confirm'){
      doRevoke(row.email, btn);
      return;
    }
    if(action === 'restore'){
      doRestore(row.email, btn);
      return;
    }
  }

  function doRevoke(email, btnEl){
    if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Revoking…'; }
    api('/auth/admin/revoke', {method: 'POST', body: JSON.stringify({email: email})}).then(function(res){
      if(res.sessionDied) return;
      adminState.confirmEmail = null;
      if(res.networkError){
        setInviteMsg('', false);
        alertInline('Couldn’t reach Mesa — check your connection and try again.');
        renderTable();
        return;
      }
      if(res.ok && res.body && res.body.ok){
        alertInline('✓ Access revoked. ' + email + ' is signed out on all devices.');
        loadUsers();
        return;
      }
      var code = res.body && res.body.error;
      var text = 'Couldn’t revoke that account — please try again.';
      if(code === 'self_revoke') text = 'You can’t revoke your own account.';
      else if(code === 'not_admin') text = 'This account isn’t an admin.';
      else if(code === 'invalid_email') text = 'That email looks invalid.';
      alertInline(text);
      renderTable();
    });
  }

  function doRestore(email, btnEl){
    if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Restoring…'; }
    api('/auth/invite-user', {method: 'POST', body: JSON.stringify({email: email, note: 'restored'})}).then(function(res){
      if(res.sessionDied) return;
      if(res.networkError){
        alertInline('Couldn’t reach Mesa — check your connection and try again.');
        renderTable();
        return;
      }
      if(res.ok && res.body && res.body.ok){
        alertInline('✓ Access restored for ' + email + '.');
        loadUsers();
        return;
      }
      var code = res.body && res.body.error;
      var text = 'Couldn’t restore that account — please try again.';
      if(code === 'not_admin') text = 'This account isn’t an admin.';
      else if(code === 'full') text = 'All seats are full — can’t restore.';
      alertInline(text);
      renderTable();
    });
  }

  // Small transient banner on the active tab. The catalogue editor uses the same feedback
  // channel as the people controls, so a staged save/delete never reports off-screen.
  function alertInline(text){
    var active = document.querySelector('.tab-pane.active');
    var host = active && (active.querySelector('#tableHost') || active.querySelector('#recipesHost') || active.querySelector('#ingredientsHost'));
    if(!host) host = document.getElementById('tableHost');
    if(!host) return;
    var el = document.createElement('p');
    el.className = 'msg error';
    el.textContent = text;
    host.parentNode.insertBefore(el, host);
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 6000);
  }

  function loadUsers(){
    var host = document.getElementById('tableHost');
    if(host) host.innerHTML = '<p class="spinner-line">Loading…</p>';
    return api('/auth/admin/users').then(function(res){
      if(res.sessionDied) return;
      if(res.networkError){
        if(host) host.innerHTML = '<div class="empty-state">Couldn’t reach Mesa — check your connection and try again.</div>';
        return;
      }
      if(!res.ok){
        var code = res.body && res.body.error;
        var text = code === 'not_admin' ? 'This account isn’t an admin.' : 'Couldn’t load the roster.';
        if(host) host.innerHTML = '<div class="empty-state">' + escapeHtml(text) + '</div>';
        return;
      }
      var body = res.body || {};
      adminState.rows = Array.isArray(body.rows) ? body.rows : [];
      adminState.confirmEmail = null;
      if(typeof body.seatsUsed === 'number' && typeof body.seatsMax === 'number'){
        setSeatsLine(body.seatsUsed, body.seatsMax);
      }
      renderTable();
    });
  }

  /* ---------------- catalog (recipes + ingredients) ---------------- */

  var catalogState = {
    loaded: false,
    recipes: [],
    foods: [],
    dirty: {},
    deleted: {},
    editingRecipe: null,
    editingFood: null,
    recipeQuery: '',
    foodQuery: ''
  };

  function loadCatalog(){
    var rHost = document.getElementById('recipesHost');
    var iHost = document.getElementById('ingredientsHost');
    if(rHost) rHost.innerHTML = '<p class="spinner-line">Loading catalog…</p>';
    if(iHost) iHost.innerHTML = '<p class="spinner-line">Loading catalog…</p>';
    api('/auth/admin/library').then(function(res){
      if(res.sessionDied) return;
      if(!res.ok){
        var msg = '<div class="empty-state">Could not load catalog.</div>';
        if(rHost) rHost.innerHTML = msg;
        if(iHost) iHost.innerHTML = msg;
        return;
      }
      catalogState.loaded = true;
      catalogState.recipes = Array.isArray(res.body.recipes) ? res.body.recipes : [];
      catalogState.foods = Array.isArray(res.body.foods) ? res.body.foods : [];
      catalogState.dirty = {};
      catalogState.deleted = {};
      renderRecipeList();
      renderFoodList();
    });
  }

  function markDirty(type, id){
    if(isDeleted(type, id)) return;
    catalogState.dirty[type + ':' + id] = true;
    updateSaveBtnState();
  }
  function isDirty(type, id){ return !!catalogState.dirty[type + ':' + id]; }
  function isDeleted(type, id){ return !!catalogState.deleted[type + ':' + id]; }
  function hasDirtyItems(){ return Object.keys(catalogState.dirty).length > 0 || Object.keys(catalogState.deleted).length > 0; }

  function validNewCatalogId(id){ return /^[a-z0-9][a-z0-9-]{0,119}$/.test(id); }
  function foodKcal(data){
    data = data || {};
    return Math.round(4 * (parseFloat(data.protein) || 0) + 4 * (parseFloat(data.carbs) || 0) + 9 * (parseFloat(data.fat) || 0));
  }
  // Filter the already-rendered rows instead of redrawing the whole panel on every
  // keystroke. Redrawing replaces the <input>, which used to drop focus after the
  // first character and made the admin search feel broken on desktop and mobile.
  function filterCatalogRows(host, query){
    var q = String(query || '').trim().toLowerCase();
    host.querySelectorAll('.item-row[data-id]').forEach(function(row){
      row.style.display = !q || row.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
    });
  }

  function addCatalogItem(type){
    var label = type === 'recipe' ? 'recipe' : 'ingredient';
    var id = window.prompt('Choose an ID for this ' + label + ' (lowercase letters, numbers and hyphens).');
    if(id === null) return;
    id = id.trim();
    if(!validNewCatalogId(id)){
      alertInline('Use lowercase letters, numbers and hyphens only for the ' + label + ' ID.');
      return;
    }
    var rows = type === 'recipe' ? catalogState.recipes : catalogState.foods;
    if(rows.some(function(row){ return row.id === id; })){
      alertInline('That ' + label + ' ID already exists.');
      return;
    }
    var data;
    if(type === 'recipe'){
      data = {title: 'New recipe', slot: 'dinner', slots: ['dinner'], styles: ['balanced'], role: 'full', season: 'evergreen', time: 20, servings: 1, ingredients: [], toTaste: [], steps: []};
      catalogState.recipes.push({id: id, source: 'custom', title: data.title, data: data, _new: true});
      markDirty('recipe', id);
      renderRecipeDetail(id);
    } else {
      data = {name: 'New ingredient', per: 100, unit: 'g', kcal: 0, protein: 0, carbs: 0, fat: 0, satFat: 0, fiber: 0, sugars: 0, freeSugars: 0, flags: [], cat: 'Produce', season: 'evergreen'};
      catalogState.foods.push({id: id, source: 'custom', name: data.name, data: data, _new: true});
      markDirty('food', id);
      renderFoodDetail(id);
    }
  }

  function stageDelete(type, id){
    var rows = type === 'recipe' ? catalogState.recipes : catalogState.foods;
    var row = rows.find(function(item){ return item.id === id; });
    if(!row) return;
    if(type === 'food'){
      var usedBy = catalogState.recipes.filter(function(recipe){
        return !isDeleted('recipe', recipe.id) && Array.isArray(recipe.data && recipe.data.ingredients)
          && recipe.data.ingredients.some(function(ing){ return ing && ing[0] === id; });
      });
      if(usedBy.length){
        alertInline('Replace or remove this ingredient from ' + usedBy.map(function(recipe){ return recipe.data.title || recipe.id; }).slice(0, 3).join(', ') + ' before deleting it.');
        return;
      }
    }
    var index = rows.indexOf(row);
    rows.splice(index, 1);
    delete catalogState.dirty[type + ':' + id];
    if(!row._new) catalogState.deleted[type + ':' + id] = true;
    updateSaveBtnState();
    if(type === 'recipe') renderRecipeList();
    else renderFoodList();
  }

  function updateSaveBtnState(){
    var btn = document.getElementById('catalogSaveBtn');
    if(btn) btn.disabled = !hasDirtyItems();
    var foodBtn = document.getElementById('catalogSaveBtnI');
    if(foodBtn) foodBtn.disabled = !hasDirtyItems();
    var badge = document.getElementById('dirtyCount');
    var foodBadge = document.getElementById('dirtyCountI');
    var n = Object.keys(catalogState.dirty).length + Object.keys(catalogState.deleted).length;
    if(badge) badge.textContent = n > 0 ? (n + ' unsaved') : '';
    if(badge) badge.style.display = n > 0 ? 'inline-block' : 'none';
    if(foodBadge) foodBadge.textContent = n > 0 ? (n + ' unsaved') : '';
    if(foodBadge) foodBadge.style.display = n > 0 ? 'inline-block' : 'none';
  }

  function saveCatalog(){
    if(!hasDirtyItems()) return;
    var foods = [], recipes = [];
    Object.keys(catalogState.dirty).forEach(function(key){
      var parts = key.split(':');
      var type = parts[0], id = parts.slice(1).join(':');
      if(type === 'food'){
        var f = catalogState.foods.find(function(x){ return x.id === id; });
        if(f) foods.push({id: f.id, source: f.source, data: f.data});
      } else if(type === 'recipe'){
        var r = catalogState.recipes.find(function(x){ return x.id === id; });
        if(r) recipes.push({id: r.id, source: r.source, data: r.data});
      }
    });
    var deletedFoods = [], deletedRecipes = [];
    Object.keys(catalogState.deleted).forEach(function(key){
      var parts = key.split(':');
      var type = parts[0], id = parts.slice(1).join(':');
      if(type === 'food') deletedFoods.push(id);
      else if(type === 'recipe') deletedRecipes.push(id);
    });
    var invalidNewRecipe = recipes.find(function(row){
      var live = catalogState.recipes.find(function(item){ return item.id === row.id; });
      var d = live && live.data;
      return live && live._new && (!d || !Array.isArray(d.ingredients) || !d.ingredients.length);
    });
    if(invalidNewRecipe){
      alertInline('Add at least one ingredient to "' + ((invalidNewRecipe.data && invalidNewRecipe.data.title) || invalidNewRecipe.id) + '" before saving it.');
      return;
    }
    var btn = document.getElementById('catalogSaveBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
    api('/auth/admin/library', {method: 'POST', body: JSON.stringify({foods: foods, recipes: recipes, deletedFoods: deletedFoods, deletedRecipes: deletedRecipes})}).then(function(res){
      if(btn){ btn.disabled = false; btn.textContent = 'Save changes to D1'; }
      if(res.sessionDied) return;
      if(res.ok){
        catalogState.dirty = {};
        catalogState.deleted = {};
        updateSaveBtnState();
        alertInline('✓ Saved ' + (foods.length + recipes.length) + ' update(s) and ' + (deletedFoods.length + deletedRecipes.length) + ' removal(s) to D1.');
        if(catalogState.editingRecipe) renderRecipeDetail(catalogState.editingRecipe);
        else renderRecipeList();
        if(catalogState.editingFood) renderFoodDetail(catalogState.editingFood);
        else renderFoodList();
      } else {
        alertInline('Save failed — ' + (res.body && res.body.error || 'unknown error'));
      }
    });
  }

  /* --- recipe list --- */

  function renderRecipeList(){
    catalogState.editingRecipe = null;
    var host = document.getElementById('recipesHost');
    if(!host) return;
    var q = catalogState.recipeQuery.toLowerCase();
    var filtered = catalogState.recipes.filter(function(r){
      if(!q) return true;
      return (r.title || '').toLowerCase().indexOf(q) !== -1 || (r.id || '').toLowerCase().indexOf(q) !== -1;
    });
    var html = '<div class="row between" style="margin-bottom:10px">'
      + '<p class="sub" style="margin:0">' + catalogState.recipes.length + ' recipes in global catalog</p>'
      + '<div class="row" style="gap:8px"><span id="dirtyCount" class="dirty-badge" style="display:none"></span>'
      + '<button class="cta ghostbtn small" id="addRecipeBtn" type="button">+ Add recipe</button>'
      + '<button class="cta small" id="catalogSaveBtn" type="button" disabled>Save changes to D1</button></div>'
      + '</div>'
      + '<div class="search-bar"><input class="inp" type="search" placeholder="Search recipes…" value="' + escapeHtml(catalogState.recipeQuery) + '" id="recipeSearchInp"></div>'
      + '<div class="item-list">';
    filtered.forEach(function(r){
      var d = r.data || {};
      var dirtyMark = isDirty('recipe', r.id) ? ' <span class="dirty-badge">edited</span>' : '';
      html += '<div class="item-row" data-id="' + escapeHtml(r.id) + '">'
        + '<div><div class="item-title">' + escapeHtml(d.title || r.title || r.id) + dirtyMark + '</div>'
        + '<div class="item-sub">' + escapeHtml(r.id) + ' · ' + escapeHtml(d.slot || '') + ' · ' + escapeHtml(d.season || 'evergreen') + '</div></div>'
        + '<span class="muted" style="font-size:12px">›</span></div>';
    });
    html += '</div>';
    host.innerHTML = html;
    var searchInp = document.getElementById('recipeSearchInp');
    if(searchInp) searchInp.addEventListener('input', function(){
      catalogState.recipeQuery = this.value;
      filterCatalogRows(host, this.value);
    });
    host.querySelectorAll('.item-row[data-id]').forEach(function(row){
      row.addEventListener('click', function(){ renderRecipeDetail(row.getAttribute('data-id')); });
    });
    var saveBtn = document.getElementById('catalogSaveBtn');
    if(saveBtn) saveBtn.addEventListener('click', saveCatalog);
    var addBtn = document.getElementById('addRecipeBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ addCatalogItem('recipe'); });
    updateSaveBtnState();
  }

  /* --- recipe detail/edit --- */

  function renderRecipeDetail(id){
    catalogState.editingRecipe = id;
    var host = document.getElementById('recipesHost');
    if(!host) return;
    var rec = catalogState.recipes.find(function(r){ return r.id === id; });
    if(!rec || !rec.data){ host.innerHTML = '<div class="empty-state">Recipe not found.</div>'; return; }
    var d = rec.data;
    var ings = Array.isArray(d.ingredients) ? d.ingredients : [];

    var html = '<span class="back-link" id="recipeBack">← Back to list</span>'
      + '<h2 style="margin:0 0 4px;font-size:20px">' + escapeHtml(d.title || id) + '</h2>'
      + '<p class="muted" style="margin:0 0 16px;font-size:12px">' + escapeHtml(id) + '</p>';

    html += '<div class="field"><label>Title</label><input class="inp" id="rdTitle" value="' + escapeHtml(d.title || '') + '"></div>';
    html += '<div class="field"><label>Slot</label><input class="inp" id="rdSlot" value="' + escapeHtml(d.slot || '') + '"></div>';
    html += '<div class="field"><label>Slots (comma-separated)</label><input class="inp" id="rdSlots" value="' + escapeHtml((d.slots || []).join(', ')) + '"><div class="muted" style="font-size:11px;margin-top:4px">Every slot the planner may use this recipe in. Leave empty to use just the Slot above. The Slot above is always kept in this list.</div></div>';
    html += '<div class="field"><label>Styles (comma-separated)</label><input class="inp" id="rdStyles" value="' + escapeHtml((d.styles || []).join(', ')) + '"></div>';
    html += '<div class="field"><label>Role</label><input class="inp" id="rdRole" value="' + escapeHtml(d.role || '') + '"></div>';
    html += '<div class="field"><label>Season</label><input class="inp" id="rdSeason" value="' + escapeHtml(d.season || 'evergreen') + '"></div>';
    html += '<div class="field"><label>Recipe image key (optional)</label><input class="inp" id="rdImageKey" value="' + escapeHtml(d.imageKey || '') + '" placeholder="for example: salad"></div>';
    html += '<div class="field"><label>Time (min)</label><input class="inp" id="rdTime" type="number" value="' + (d.time || '') + '"></div>';
    html += '<div class="field"><label>Servings</label><input class="inp" id="rdServings" type="number" value="' + (d.servings || '') + '"></div>';

    html += '<div class="field"><label>Ingredients</label><div id="rdIngs">';
    ings.forEach(function(ing, idx){
      html += '<div class="ing-row" data-idx="' + idx + '">'
        + '<span class="ing-id">' + escapeHtml(ing[0]) + '</span>'
        + '<input class="inp ing-g" style="width:70px;padding:4px 8px" type="number" value="' + (ing[1] || 0) + '" data-idx="' + idx + '" data-field="grams">'
        + '<span class="muted" style="font-size:11px">g</span>'
        + '<button class="ing-del" data-idx="' + idx + '" type="button">✕</button>'
        + '</div>';
    });
    html += '</div>';
    html += '<div class="add-ing-row">'
      + '<input class="inp" id="rdNewIngId" placeholder="food-id" style="flex:1">'
      + '<input class="inp" id="rdNewIngG" placeholder="grams" type="number" style="width:80px">'
      + '<button class="cta small" id="rdAddIng" type="button">+ Add</button>'
      + '</div></div>';

    html += '<div class="field"><label>To taste (comma-separated)</label><input class="inp" id="rdToTaste" value="' + escapeHtml((d.toTaste || []).join(', ')) + '"></div>';

    html += '<div class="field"><label>Steps (JSON array)</label><textarea class="inp" id="rdSteps">' + escapeHtml(JSON.stringify(d.steps || [], null, 2)) + '</textarea></div>';

    if(d.optionGroups){
      html += '<div class="field"><label>Option groups (JSON)</label><textarea class="inp" id="rdOptGroups">' + escapeHtml(JSON.stringify(d.optionGroups, null, 2)) + '</textarea></div>';
    }

    html += '<div class="row" style="margin-top:16px;gap:8px;flex-wrap:wrap"><button class="cta" id="rdApply" type="button">Apply changes</button>'
      + '<button class="cta ghostbtn" id="rdDeleteStart" type="button">Remove recipe</button></div>';

    host.innerHTML = html;

    document.getElementById('recipeBack').addEventListener('click', function(){ renderRecipeList(); });
    document.getElementById('rdDeleteStart').addEventListener('click', function(){
      if(window.confirm('Remove "' + (d.title || id) + '" from the live catalog? This takes effect when you save.')) stageDelete('recipe', id);
    });

    var ingsHost = document.getElementById('rdIngs');
    ingsHost.querySelectorAll('input[data-field="grams"]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var i = parseInt(inp.getAttribute('data-idx'), 10);
        if(d.ingredients[i]) d.ingredients[i][1] = parseFloat(inp.value) || 0;
      });
    });
    ingsHost.querySelectorAll('.ing-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-idx'), 10);
        d.ingredients.splice(i, 1);
        markDirty('recipe', id);
        renderRecipeDetail(id);
      });
    });
    document.getElementById('rdAddIng').addEventListener('click', function(){
      var fid = document.getElementById('rdNewIngId').value.trim();
      var fg = parseFloat(document.getElementById('rdNewIngG').value) || 0;
      if(!fid) return;
      if(!d.ingredients) d.ingredients = [];
      d.ingredients.push([fid, fg]);
      markDirty('recipe', id);
      renderRecipeDetail(id);
    });

    document.getElementById('rdApply').addEventListener('click', function(){
      d.title = document.getElementById('rdTitle').value.trim() || d.title;
      d.slot = document.getElementById('rdSlot').value.trim() || d.slot;
      // `slots` is what the app's planner reads for eligibility (data/recipes.js:recipeSlotList
      // unions the primary slot in). Clearing this field means "just the primary slot" — it must
      // NOT silently keep the previous list, which was the "my slot change keeps reverting" bug.
      // Keep the two coherent so they can never contradict: the primary slot is always an eligible
      // slot and comes first.
      var slotsList = document.getElementById('rdSlots').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      if(!slotsList.length && d.slot) slotsList = [d.slot];
      if(d.slot && slotsList.indexOf(d.slot) === -1) slotsList.unshift(d.slot);
      if(!d.slot && slotsList.length) d.slot = slotsList[0];
      if(slotsList.length) d.slots = slotsList;
      var stylesVal = document.getElementById('rdStyles').value;
      d.styles = stylesVal ? stylesVal.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : d.styles;
      d.role = document.getElementById('rdRole').value.trim() || d.role;
      d.season = document.getElementById('rdSeason').value.trim() || 'evergreen';
      var imageKey = document.getElementById('rdImageKey').value.trim();
      if(imageKey) d.imageKey = imageKey;
      else delete d.imageKey;
      var timeVal = document.getElementById('rdTime').value;
      if(timeVal) d.time = parseInt(timeVal, 10);
      var servVal = document.getElementById('rdServings').value;
      if(servVal) d.servings = parseInt(servVal, 10);
      var ttVal = document.getElementById('rdToTaste').value;
      d.toTaste = ttVal ? ttVal.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : [];
      try{ d.steps = JSON.parse(document.getElementById('rdSteps').value); }catch(e){}
      var ogEl = document.getElementById('rdOptGroups');
      if(ogEl){ try{ d.optionGroups = JSON.parse(ogEl.value); }catch(e){} }
      rec.title = d.title;
      // Reflect the normalized slot/slots back into the inputs so a cleared or corrected Slots
      // field visibly shows what will actually be saved (no more "did my change take?" doubt).
      document.getElementById('rdSlot').value = d.slot || '';
      document.getElementById('rdSlots').value = (d.slots || []).join(', ');
      markDirty('recipe', id);
      alertInline('✓ Changes staged — click "Save changes to D1" to push.');
    });
  }

  /* --- food/ingredient list --- */

  function renderFoodList(){
    catalogState.editingFood = null;
    var host = document.getElementById('ingredientsHost');
    if(!host) return;
    var q = catalogState.foodQuery.toLowerCase();
    var filtered = catalogState.foods.filter(function(f){
      if(!q) return true;
      return (f.name || '').toLowerCase().indexOf(q) !== -1 || (f.id || '').toLowerCase().indexOf(q) !== -1;
    });
    var html = '<div class="row between" style="margin-bottom:10px">'
      + '<p class="sub" style="margin:0">' + catalogState.foods.length + ' ingredients in global catalog</p>'
      + '<div class="row" style="gap:8px"><span id="dirtyCountI" class="dirty-badge" style="display:none"></span>'
      + '<button class="cta ghostbtn small" id="addFoodBtn" type="button">+ Add ingredient</button>'
      + '<button class="cta small" id="catalogSaveBtnI" type="button" disabled>Save changes to D1</button></div>'
      + '</div>'
      + '<div class="search-bar"><input class="inp" type="search" placeholder="Search ingredients…" value="' + escapeHtml(catalogState.foodQuery) + '" id="foodSearchInp"></div>'
      + '<div class="item-list">';
    filtered.forEach(function(f){
      var d = f.data || {};
      var dirtyMark = isDirty('food', f.id) ? ' <span class="dirty-badge">edited</span>' : '';
      html += '<div class="item-row" data-id="' + escapeHtml(f.id) + '">'
        + '<div><div class="item-title">' + escapeHtml(d.name || f.name || f.id) + dirtyMark + '</div>'
        + '<div class="item-sub">' + escapeHtml(f.id) + ' · ' + escapeHtml(d.cat || '') + ' · ' + foodKcal(d) + ' kcal · ' + Math.round((d.protein || 0) * 10) / 10 + 'p / ' + Math.round((d.carbs || 0) * 10) / 10 + 'c / ' + Math.round((d.fat || 0) * 10) / 10 + 'f per 100g</div></div>'
        + '<span class="muted" style="font-size:12px">›</span></div>';
    });
    html += '</div>';
    host.innerHTML = html;
    var searchInp = document.getElementById('foodSearchInp');
    if(searchInp) searchInp.addEventListener('input', function(){
      catalogState.foodQuery = this.value;
      filterCatalogRows(host, this.value);
    });
    host.querySelectorAll('.item-row[data-id]').forEach(function(row){
      row.addEventListener('click', function(){ renderFoodDetail(row.getAttribute('data-id')); });
    });
    var saveBtn = document.getElementById('catalogSaveBtnI');
    if(saveBtn) saveBtn.addEventListener('click', saveCatalog);
    var addBtn = document.getElementById('addFoodBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ addCatalogItem('food'); });
    updateSaveBtnState();
  }

  /* --- food detail/edit --- */

  function renderFoodDetail(id){
    catalogState.editingFood = id;
    var host = document.getElementById('ingredientsHost');
    if(!host) return;
    var food = catalogState.foods.find(function(f){ return f.id === id; });
    if(!food || !food.data){ host.innerHTML = '<div class="empty-state">Ingredient not found.</div>'; return; }
    var d = food.data;
    if(!Array.isArray(d.components)) d.kcal = foodKcal(d);

    var fields = [
      ['name', 'Name', 'text'], ['cat', 'Category', 'text'], ['season', 'Season', 'text'],
      ['protein', 'Protein (per 100g)', 'number'], ['carbs', 'Carbs (per 100g)', 'number'],
      ['fat', 'Fat (per 100g)', 'number'], ['satFat', 'Sat fat', 'number'],
      ['kcal', 'Calories (computed from macros)', 'number', true],
      ['fiber', 'Fiber', 'number'], ['sugars', 'Sugars', 'number'], ['freeSugars', 'Free sugars', 'number'],
      ['unit', 'Unit (g/piece/ml)', 'text'], ['avgG', 'Avg weight (g)', 'number'],
      ['iconKey', 'Watercolor icon key (optional)', 'text']
    ];

    var html = '<span class="back-link" id="foodBack">← Back to list</span>'
      + '<h2 style="margin:0 0 4px;font-size:20px">' + escapeHtml(d.name || id) + '</h2>'
      + '<p class="muted" style="margin:0 0 16px;font-size:12px">' + escapeHtml(id) + '</p>';

    fields.forEach(function(f){
      var val = d[f[0]];
      if(val === undefined || val === null) val = '';
      html += '<div class="field"><label>' + escapeHtml(f[1]) + '</label><input class="inp" data-key="' + f[0] + '" type="' + f[2] + '" value="' + escapeHtml(String(val)) + '"' + (f[3] ? ' readonly aria-readonly="true"' : '') + '></div>';
    });

    var flags = Array.isArray(d.flags) ? d.flags.join(', ') : '';
    html += '<div class="field"><label>Flags (comma-separated)</label><input class="inp" data-key="flags" value="' + escapeHtml(flags) + '"></div>';

    html += '<div class="row" style="margin-top:16px;gap:8px;flex-wrap:wrap"><button class="cta" id="fdApply" type="button">Apply changes</button>'
      + '<button class="cta ghostbtn" id="fdDeleteStart" type="button">Remove ingredient</button></div>';

    host.innerHTML = html;

    document.getElementById('foodBack').addEventListener('click', function(){ renderFoodList(); });
    document.getElementById('fdDeleteStart').addEventListener('click', function(){
      if(window.confirm('Remove "' + (d.name || id) + '" from the live catalog? This takes effect when you save.')) stageDelete('food', id);
    });

    document.getElementById('fdApply').addEventListener('click', function(){
      host.querySelectorAll('input[data-key]').forEach(function(inp){
        var key = inp.getAttribute('data-key');
        var val = inp.value;
        if(key === 'flags'){
          d.flags = val ? val.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : [];
        } else if(inp.type === 'number'){
          d[key] = val === '' ? undefined : parseFloat(val);
        } else {
          d[key] = val;
        }
      });
      d.kcal = foodKcal(d);
      var kcalInp = host.querySelector('input[data-key="kcal"]');
      if(kcalInp) kcalInp.value = d.kcal;
      food.name = d.name;
      markDirty('food', id);
      alertInline('✓ Changes staged — click "Save changes to D1" to push.');
    });
  }

  /* ---------------- boot ---------------- */

  function boot(){
    var hashResult = consumeAuthHash();
    var initialError = null;
    if(hashResult && hashResult.error){
      initialError = authErrorMessage(hashResult.error);
    }

    var token = getToken();
    if(!token){
      renderSignedOut(initialError, true);
      return;
    }

    renderLoading();
    api('/auth/me').then(function(res){
      if(res.sessionDied) return; // already rendered signed-out
      if(res.networkError){
        renderSignedOut('Couldn’t reach Mesa — check your connection and try again.', true);
        return;
      }
      if(!res.ok){
        renderSignedOut('Sign-in check failed — please try again.', true);
        return;
      }
      var body = res.body || {};
      var user = (body.user && typeof body.user === 'object') ? body.user : {};
      if(!body.isAdmin){
        renderNonAdmin(user);
        return;
      }
      renderAdminShell(user);
      setSeatsLine(
        typeof body.seatsUsed === 'number' ? body.seatsUsed : 0,
        typeof body.seatsMax === 'number' ? body.seatsMax : 0
      );
      loadUsers();
    });
  }

  boot();
})();
</script>
</body>
</html>
