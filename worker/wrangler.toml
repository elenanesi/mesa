# Mesa couple-sync worker (Phase 2, task S1).
# Local verification: `npx --yes wrangler@latest dev --local --port 8787` (miniflare, no
# Cloudflare auth needed). Real deploy is task S2 — blocked on the mesa-deploy API token
# needing Workers Scripts:Edit + Workers KV Storage:Edit (see README.md / PHASE2-plan.md).

name = "mesa-sync"
main = "sync.js"
compatibility_date = "2026-07-13"

kv_namespaces = [
  { binding = "MESA_KV", id = "2f868b0b17374dffaef6798410c0ab38" }
]

[[d1_databases]]
binding = "MESA_DB"
database_name = "mesa-library"
database_id = "660c50ce-13b5-433f-a00b-68349ac5e851"

# Phase 3A user accounts (Google sign-in). GOOGLE_CLIENT_ID is a placeholder until
# Elena's manual GCP step (OAuth consent screen + client) is done — see
# PHASE3A-auth-spec.md. The matching secret is NOT set here (secrets don't belong in
# wrangler.toml / version control) — at deploy time run:
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
# For local dev, put GOOGLE_CLIENT_SECRET in worker/.dev.vars instead (gitignored).
[vars]
GOOGLE_CLIENT_ID = "242945555602-09h5e3eofta1a9hb3123sa03k40drtp2.apps.googleusercontent.com"
MAX_USERS = "20"
# Phase 3B (B1/B5) session gating on /sync/:code and /library/:code (see worker/sync.js
# module doc). FLIPPED to "1" on 2026-07-26: both existing accounts had signed in and both
# users' household_code matched the code their devices sync under (verified against the KV
# access-bootstrap value before flipping), so no device was left stranded. From here a
# request with no valid session gets 401 session_required — knowing a household code is no
# longer enough to read or write a household's data. GET /library/GLOBAL stays public (the
# built-in catalog is fetched before login).
# Setting this back to "0" re-opens every household to anyone holding its code. Don't.
REQUIRE_SESSION = "1"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
